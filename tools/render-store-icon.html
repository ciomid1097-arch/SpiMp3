<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SpiMp3 store icon renderer</title>
<style>
  html,body{margin:0;padding:0;background:#0B0B16;}
  #stage{width:1080px;height:1080px;position:absolute;top:0;left:0;}
  svg{display:block;width:1080px;height:1080px;}
</style>
</head>
<body>
<div id="stage">
<!-- Mirrors app/src/main/res/drawable/ic_launcher_foreground.xml exactly:
     108dp canvas, note glyph centered at 54,54, group scale 0.78. -->
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" shape-rendering="geometricPrecision">
  <rect width="108" height="108" fill="#0B0B16"/>
  <g>
    <path d="M28.5,61.5 L28.5,46.5 A4.5,4.5 0 0 1 33,42 A4.5,4.5 0 0 1 37.5,46.5 L37.5,61.5 A4.5,4.5 0 0 1 33,66 A4.5,4.5 0 0 1 28.5,61.5 Z" fill="#22C55E"/>
    <path d="M42.5,69.5 L42.5,38.5 A4.5,4.5 0 0 1 47,34 A4.5,4.5 0 0 1 51.5,38.5 L51.5,69.5 A4.5,4.5 0 0 1 47,74 A4.5,4.5 0 0 1 42.5,69.5 Z" fill="#4ADE80"/>
    <path d="M56.5,77.5 L56.5,30.5 A4.5,4.5 0 0 1 61,26 A4.5,4.5 0 0 1 65.5,30.5 L65.5,77.5 A4.5,4.5 0 0 1 61,82 A4.5,4.5 0 0 1 56.5,77.5 Z" fill="#22C55E"/>
    <path d="M70.5,54 A2.75,2.75 0 0 1 73.25,51.25 L76.75,51.25 A2.75,2.75 0 0 1 79.5,54 A2.75,2.75 0 0 1 76.75,56.75 L73.25,56.75 A2.75,2.75 0 0 1 70.5,54 Z" fill="#4ADE80"/>
  </g>
</svg>
</div>
<script>
// Render the SVG to a 512x512 PNG and offer it as a download.
document.getElementById('icon').addEventListener('click', async () => {
  const svg = document.getElementById('icon');
  const xml = new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  c.getContext('2d').drawImage(img, 0, 0, 512, 512);
  URL.revokeObjectURL(url);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'play-icon.png';
  a.click();
});
</script>
</body>
</html>
