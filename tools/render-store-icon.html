<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SpiMp3 store icon renderer</title>
<style>
  html,body{margin:0;padding:0;background:#0B0B16;}
  #stage{width:1080px;height:1080px;position:absolute;top:0;left:0;}
  svg{display:block;width:1080px;height:1080px;}
</style>
</head>
<body>
<div id="stage">
<!-- Mirrors app/src/main/res/drawable/ic_launcher_foreground.xml exactly:
     108dp canvas, note glyph centered at 54,54, group scale 0.78. -->
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" shape-rendering="geometricPrecision">
  <rect width="108" height="108" fill="#0B0B16"/>
  <g transform="translate(54,54) scale(0.78) translate(-54,-54)">
    <path d="M51.5,30.75 L51.5,72.75 A13,13 0 1 1 46.5,61.95 L46.5,38.75 L82.5,32.75 L82.5,58.75 A13,13 0 1 1 77.5,47.95 L77.5,22.75 Z" fill="#22C55E"/>
    <path d="M59.5,80.75 m-2.5,0 a2.5,2.5 0 1 1 5,0 a2.5,2.5 0 1 1 -5,0" fill="#4ADE80"/>
    <path d="M69.5,80.75 m-2.5,0 a2.5,2.5 0 1 1 5,0 a2.5,2.5 0 1 1 -5,0" fill="#4ADE80"/>
    <path d="M79.5,80.75 m-2.5,0 a2.5,2.5 0 1 1 5,0 a2.5,2.5 0 1 1 -5,0" fill="#4ADE80"/>
  </g>
</svg>
</div>
<script>
// Render the SVG to a 512x512 PNG and offer it as a download.
document.getElementById('icon').addEventListener('click', async () => {
  const svg = document.getElementById('icon');
  const xml = new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([xml], {type: 'image/svg+xml'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  c.getContext('2d').drawImage(img, 0, 0, 512, 512);
  URL.revokeObjectURL(url);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'play-icon.png';
  a.click();
});
</script>
</body>
</html>
