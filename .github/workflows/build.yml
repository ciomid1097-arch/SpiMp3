name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build + unit tests (debug, no keystore needed)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:test :app:lintDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiMp3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Block non-APK assets on the latest release (update-check safety)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest_tag" ]; then
            bad=$(gh release view "$latest_tag" --json assets \
              -q '.assets[].name' | grep -v "\.apk$" || true)
            if [ -n "$bad" ]; then
              echo "Removing non-APK assets that would break the update checker: $bad"
              for f in $bad; do gh release delete-asset "$latest_tag" "$f" --yes || true; done
            fi
          fi
